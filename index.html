<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Bilingual (EN/中文) re-analysis of the 1,7-mRCTR malaria pilot in Rufiji, Tanzania, 2015–2018.">
<meta property="og:title" content="1,7-mRCTR Evidence Portal">
<meta property="og:description" content="Interactive re-analysis of the China–UK–Tanzania 1,7-mRCTR malaria pilot · 1,7-mRCTR 证据门户">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 30 30%27%3E%3Crect width=%2730%27 height=%2730%27 rx=%277%27 fill=%27%230b1e28%27/%3E%3Cpath d=%27M6 21 L11 14 L15 17 L20 8 L24 11%27 fill=%27none%27 stroke=%27%235598e7%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>1,7-mRCTR Evidence Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: field-report column — a night-blue evidence band up top, then numbered-by-topic sections of chart cards on cool paper. */
:root{
  --bg:#f3f6f5; --surface:#fcfdfc; --surface-2:#ebf0ee; --ink:#0d1b1e; --ink-2:#46575b; --muted:#76878a;
  --line:#dce4e2; --line-2:#c3cfcc; --accent:#0d6b62; --accent-ink:#ffffff; --focus:#0d6b62;
  --int:#2a78d6; --int-soft:#9ec5f4; --ctl:#898781; --ctl-soft:#cfcdc6; --ctl-ink:#5f5e5a;
  --hi-area:#b54016; --lo-area:#ef7c59;
  --care-1:#1baf7a; --care-2:#eda100; --care-3:#e87ba4; --care-4:#008300; --care-o:#b9bdb9;
  --heat-0:#ffe7de; --heat-1:#ffc8b7; --heat-2:#fba58a; --heat-3:#ef7c59; --heat-4:#d8582e; --heat-5:#b54016; --heat-6:#8f2c05;
  --teal-0:#dbf5f1; --teal-1:#aee4dc; --teal-2:#77d1c5; --teal-3:#1fb9ab; --teal-4:#009f91; --teal-5:#008275; --teal-6:#00655b;
  --land:#e3e9e7; --land-line:#f8faf9; --water:#eaf1f3;
  --good:#0ca30c; --good-ink:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --night:#0b1e28; --night-2:#112a36; --on-night:#eaf2f1; --on-night-2:#a9bfc2; --night-line:#25404c;
  --n-int:#5598e7; --n-ctl:#97a3a5;
  --f-display:"Archivo","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --maxw:1240px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1316; --surface:#101b1f; --surface-2:#15242a; --ink:#e7eeed; --ink-2:#b3c1c2; --muted:#829395;
  --line:#21323a; --line-2:#34474e; --accent:#4fb3a6; --accent-ink:#06201d; --focus:#6cc9bc;
  --int:#3987e5; --int-soft:#1c5cab; --ctl:#898781; --ctl-soft:#4a4a46; --ctl-ink:#b9b8b0;
  --hi-area:#f6825f; --lo-area:#af5234;
  --care-1:#199e70; --care-2:#c98500; --care-3:#d55181; --care-4:#008300; --care-o:#5b605d;
  --heat-0:#2c2320; --heat-1:#4f2d22; --heat-2:#78392a; --heat-3:#a24a31; --heat-4:#cb5e3e; --heat-5:#f17d5a; --heat-6:#ffa88b;
  --teal-0:#17292a; --teal-1:#174c46; --teal-2:#04665e; --teal-3:#008579; --teal-4:#00a396; --teal-5:#2cc0b1; --teal-6:#75d9cc;
  --land:#1a282d; --land-line:#0e181b; --water:#0d1a1f;
  --night:#06141a; --night-2:#0c212a; --night-line:#1f3a45;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1316; --surface:#101b1f; --surface-2:#15242a; --ink:#e7eeed; --ink-2:#b3c1c2; --muted:#829395;
  --line:#21323a; --line-2:#34474e; --accent:#4fb3a6; --accent-ink:#06201d; --focus:#6cc9bc;
  --int:#3987e5; --int-soft:#1c5cab; --ctl:#898781; --ctl-soft:#4a4a46; --ctl-ink:#b9b8b0;
  --hi-area:#f6825f; --lo-area:#af5234;
  --care-1:#199e70; --care-2:#c98500; --care-3:#d55181; --care-4:#008300; --care-o:#5b605d;
  --heat-0:#2c2320; --heat-1:#4f2d22; --heat-2:#78392a; --heat-3:#a24a31; --heat-4:#cb5e3e; --heat-5:#f17d5a; --heat-6:#ffa88b;
  --teal-0:#17292a; --teal-1:#174c46; --teal-2:#04665e; --teal-3:#008579; --teal-4:#00a396; --teal-5:#2cc0b1; --teal-6:#75d9cc;
  --land:#1a282d; --land-line:#0e181b; --water:#0d1a1f;
  --night:#06141a; --night-2:#0c212a; --night-line:#1f3a45;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:lang(zh-CN) body,html:lang(zh-CN) body{line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;text-wrap:balance;margin:0;letter-spacing:-0.01em}
html:lang(zh-CN) h1,html:lang(zh-CN) h2,html:lang(zh-CN) h3{font-stretch:100%;letter-spacing:0.01em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
html:lang(zh-CN) .eyebrow{letter-spacing:.12em}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:13.5px;color:var(--ink-2);text-decoration:none;padding:7px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--surface-2);font-weight:600}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;flex:none;background:var(--bg)}
.lang button{font:600 12.5px var(--f-body);border:0;background:none;color:var(--ink-2);padding:5px 12px;border-radius:999px;cursor:pointer;min-width:46px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
@media (max-width:860px){.nav{display:none}.brand span{display:none}.top .wrap{justify-content:space-between}}

/* ---------- hero ---------- */
.hero{background:var(--night);color:var(--on-night);border-bottom:1px solid var(--night-line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 420px at 88% -10%, rgba(85,152,231,.16), transparent 60%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 64px),
  repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 64px);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;padding-block:56px 44px;align-items:center}
.hero .eyebrow{color:var(--on-night-2)}
.hero h1{font-size:clamp(30px,4.1vw,50px);line-height:1.06;font-weight:750;margin-top:16px;color:var(--on-night)}
html:lang(zh-CN) .hero h1{line-height:1.25;font-weight:700}
.hero .lead{margin-top:18px;font-size:17.5px;color:var(--on-night-2);max-width:60ch}
.hero .lead b{color:var(--on-night);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:30px;background:var(--night-line);border:1px solid var(--night-line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--night-2);padding:14px 14px 12px}
.kpi .v{font-size:22px;font-weight:600;color:var(--on-night);line-height:1.15}
.kpi .l{font-size:12.5px;color:var(--on-night-2);margin-top:4px;line-height:1.35}
.hero-chart{background:rgba(255,255,255,.03);border:1px solid var(--night-line);border-radius:14px;padding:18px 18px 10px}
.hero-fig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero-fig .big{font-size:56px;line-height:1;font-weight:600;color:var(--on-night);letter-spacing:-.02em}
.hero-fig .cap{font-size:14px;color:var(--on-night-2);max-width:30ch;line-height:1.4}
.hero-chart .chart{margin-top:6px}
.hero .src{font-size:12px;color:var(--on-night-2);margin-top:6px;font-family:var(--f-mono)}
@media (max-width:960px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:36px 32px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- sections ---------- */
main{display:block}
.sec{padding-block:64px 8px}
.sec-head{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:32px;margin-bottom:26px;align-items:start}
.sec-head .eyebrow{padding-top:8px;border-top:2px solid var(--ink);display:inline-block}
.sec-head h2{font-size:clamp(24px,2.6vw,32px);line-height:1.15;font-weight:700}
.sec-head .intro{margin-top:10px;color:var(--ink-2);max-width:70ch}
@media (max-width:760px){.sec-head{grid-template-columns:minmax(0,1fr);gap:10px}.sec{padding-block:44px 4px}}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:900px){.g2,.g-wide{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card-h h3{font-size:16.5px;font-weight:650;line-height:1.3;font-stretch:105%}
html:lang(zh-CN) .card-h h3{font-weight:700}
.card-h .sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.card .chart{margin-top:14px;min-width:0;position:relative}
.card .note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tbtn{font:500 12px var(--f-mono);color:var(--ink-2);background:none;border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;cursor:pointer}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
.tview{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tview table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tview th,.tview td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tview th:first-child,.tview td:first-child{text-align:left}
.tview th{font-weight:600;color:var(--ink-2);background:var(--surface-2);font-size:12px}
.tview tr:last-child td{border-bottom:0}

/* segmented controls */
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:2px;background:var(--bg);flex-wrap:wrap}
.seg button{font:500 13px var(--f-body);border:0;background:none;color:var(--ink-2);padding:5px 11px;border-radius:6px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(0,0,0,.06);font-weight:600}
.ctrl-l{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em;margin-right:6px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lk-line{width:18px;height:0;border-top:2px solid}
.lk-dash{width:18px;height:0;border-top:2px dashed}
.lk-dot{width:10px;height:10px;border-radius:50%}
.lk-ring{width:10px;height:10px;border-radius:50%;border:2px solid;background:var(--surface)}
.lk-box{width:12px;height:12px;border-radius:3px}

/* findings */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.fgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.find{grid-template-columns:minmax(0,1fr)}.find .stat{grid-row:3;grid-column:1;text-align:left;display:flex;gap:10px;align-items:baseline;min-width:0}.find .stat .u{margin:0;max-width:none}.find p{grid-row:4}.find .more{grid-row:5}}
.find{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s}
.find:hover{border-color:var(--line-2);transform:translateY(-1px)}
.find .chip{grid-column:1/-1;grid-row:1;justify-self:start;align-self:start}
.find h3{grid-column:1;grid-row:2}
.find h3{font-size:17px;line-height:1.3;font-weight:650;font-stretch:104%}
html:lang(zh-CN) .find h3{font-weight:700}
.find .stat{grid-row:2/4;grid-column:2;text-align:right;align-self:start;min-width:84px}
.find .stat .v{font-size:28px;font-weight:600;line-height:1.05;letter-spacing:-.01em}
.find .stat .u{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.3;max-width:13ch;margin-left:auto}
.find p{font-size:14.5px;color:var(--ink-2);grid-column:1;grid-row:3}
.find .more{grid-column:1/-1;grid-row:4;font-size:12.5px;color:var(--accent);font-family:var(--f-mono);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
html:lang(zh-CN) .chip{letter-spacing:.08em}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cc,var(--muted))}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
@media (max-width:900px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.map-stage{position:relative;min-width:0;background:var(--water)}
#map-svg{display:block;width:100%;height:auto;cursor:grab}
#map-svg:active{cursor:grabbing}
.map-legend svg{flex:none}
.map-tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:600 16px var(--f-body);cursor:pointer;display:grid;place-items:center}
.map-tools button:hover{background:var(--surface-2)}
.inset{position:absolute;left:12px;bottom:12px;width:120px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
.inset .cap{font:500 10px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
@media (max-width:560px){.inset{display:none}}
.map-legend{position:absolute;left:12px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink-2);max-width:250px}
.map-legend .ttl{font-weight:600;color:var(--ink);font-size:12.5px;margin-bottom:6px}
.ramp{display:flex;height:10px;border-radius:3px;overflow:hidden;width:200px;max-width:100%}
.ramp span{flex:1}
.ramp-t{display:flex;justify-content:space-between;width:200px;max-width:100%;font:500 10.5px var(--f-mono);color:var(--muted);margin-top:3px}
.map-legend .row{display:flex;align-items:center;gap:7px;margin-top:6px}
@media (max-width:560px){.map-legend{position:static;max-width:none;border:0;border-bottom:1px solid var(--line);border-radius:0}}
.panel{border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;background:var(--surface)}
@media (max-width:900px){.panel{border-left:0;border-top:1px solid var(--line)}}
.panel .empty{color:var(--muted);font-size:14px}
.panel h3{font-size:19px;font-weight:700}
.panel .meta{font-size:13px;color:var(--muted)}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv .box{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.pv .box .k{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em}
.pv .box .v{font-size:24px;font-weight:600;line-height:1.2}
.pv .box .n{font-size:11.5px;color:var(--muted)}
.armpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2)}
.armpill i{width:8px;height:8px;border-radius:50%}
.vtable{margin-top:14px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.vtable table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.vtable th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:600;text-align:right;padding:8px 10px;cursor:pointer;white-space:nowrap;user-select:none}
.vtable th:first-child,.vtable td:first-child{text-align:left}
.vtable td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.vtable tr{cursor:pointer}
.vtable tbody tr:hover td{background:var(--surface-2)}
.vtable tr.sel td{background:color-mix(in srgb,var(--int) 12%,transparent)}
.bar-cell{display:inline-block;height:8px;border-radius:0 2px 2px 0;vertical-align:middle;margin-left:6px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .l{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile .v{font-size:26px;font-weight:600;margin-top:4px;line-height:1.15}
.tile .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* implications */
.imp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.imp{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.imp{grid-template-columns:minmax(0,1fr)}}
.imp div{border-top:2px solid var(--ink);padding-top:12px}
.imp h3{font-size:16px;font-weight:650;line-height:1.3}
.imp p{font-size:14px;color:var(--ink-2);margin-top:6px}

/* data quality */
.dq{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.dq-row{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,.9fr);gap:18px;padding:16px 18px;border-top:1px solid var(--line);align-items:start}
.dq-row:first-child{border-top:0}
@media (max-width:820px){.dq-row{grid-template-columns:minmax(0,1fr);gap:8px}}
.sev{display:inline-flex;align-items:center;gap:7px;font:600 11.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.sev svg{flex:none}
.dq-row h3{font-size:15.5px;font-weight:650;line-height:1.35}
.dq-row p{font-size:14px;color:var(--ink-2);margin-top:4px}
.dq-row .fix{font-size:13.5px;color:var(--ink-2)}
.dq-row .fix b{display:block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.cm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:10px}
.cm .m{font-size:12px;color:var(--muted)}
.cm table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.cm td,.cm th{border:1px solid var(--line);padding:4px 8px;text-align:right}
.cm th{background:var(--surface-2);font-weight:600;color:var(--ink-2)}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
@media (max-width:900px){.tl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tl{grid-template-columns:minmax(0,1fr)}}
.tl > div{padding:18px;border-left:1px solid var(--line);position:relative}
.tl > div:first-child{border-left:0}
@media (max-width:900px){.tl > div:nth-child(3){border-left:0}.tl > div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:560px){.tl > div{border-left:0!important}.tl > div+div{border-top:1px solid var(--line)}}
.tl .yr{font:600 13px var(--f-mono);color:var(--accent)}
.tl h3{font-size:16px;margin-top:6px;font-weight:650;line-height:1.3}
.tl p{font-size:13.5px;color:var(--ink-2);margin-top:8px}
.tl .cite{font-size:12px;color:var(--muted);margin-top:10px;font-style:italic}
.tl .here{display:inline-block;margin-top:10px;font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--int) 14%,transparent);color:var(--ink);padding:3px 8px;border-radius:4px}

/* methods */
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 36px}
@media (max-width:820px){.methods{grid-template-columns:minmax(0,1fr)}}
.methods h3{font-size:14px;font-family:var(--f-mono);font-stretch:100%;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.methods p,.methods li{font-size:14.5px;color:var(--ink-2)}
.methods ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px}
.methods p{margin-top:8px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* methods accordion */
.acc-wrap{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc{border-top:1px solid var(--line)}
.acc:first-child{border-top:0}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;font-family:var(--f-display);font-stretch:106%;font-weight:650;font-size:17px;color:var(--ink)}
html:lang(zh-CN) .acc summary{font-stretch:100%;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s;flex:none}
.acc[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.acc summary:hover{background:var(--surface-2)}
.acc .acc-b{padding:2px 20px 22px;color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc .acc-b p{max-width:80ch}
.acc .acc-b ul{margin:0;padding-left:18px;display:grid;gap:8px;max-width:90ch}
.acc .acc-b b{color:var(--ink);font-weight:600}
.mt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.mt{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
.mt th{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:12px;text-align:left;padding:8px 10px;white-space:nowrap}
.mt td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink-2);min-width:90px}
.mt td:first-child{color:var(--ink);font-weight:500}
.mt.steps td:first-child{font-family:var(--f-mono);color:var(--muted);min-width:0;width:28px}
.mt.steps td:nth-child(2){color:var(--ink);font-weight:600;min-width:110px}
.mt.steps td:nth-child(3){min-width:260px}
.mt.steps td:nth-child(4),.mt.steps td:nth-child(5){font-variant-numeric:tabular-nums;min-width:150px}
.eq{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:16px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:12px 16px;overflow-x:auto;white-space:nowrap}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:700px){.flow{grid-template-columns:minmax(0,1fr)}}
.flow-col{display:flex;flex-direction:column;align-items:stretch}
.flow-col h4{margin:0 0 8px;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fbox{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--surface)}
.fbox .n{font-size:20px;font-weight:600;color:var(--ink);line-height:1.2}
.fbox .l{font-size:13px;color:var(--ink-2)}
.fbox .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.fbox.final{border-color:var(--int);box-shadow:inset 3px 0 0 var(--int)}
.fstep{display:grid;grid-template-columns:22px 1fr;align-items:center;min-height:34px;padding-left:14px}
.fstep i{width:2px;height:100%;min-height:34px;background:var(--line-2);justify-self:center}
.fstep span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.flow-total{grid-column:1/-1;font-size:13.5px;color:var(--ink)}
.wbar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle}
.wl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl th.num{text-align:right}
.ver{display:inline-block;margin-left:6px;font:500 11.5px var(--f-mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
footer{margin-top:72px;border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:26px 32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* tooltip */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:150px;max-width:280px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip .tt{font-weight:600;margin-bottom:5px;color:var(--ink)}
#tip .tr{display:grid;grid-template-columns:16px auto 1fr;align-items:center;gap:6px;margin-top:2px}
#tip .tr i{width:14px;height:0;border-top:2px solid}
#tip .tr b{font-weight:600;font-variant-numeric:tabular-nums}
#tip .tr span{color:var(--ink-2)}
#tip .tn{color:var(--muted);margin-top:5px;font-size:11.5px}

svg text{font-family:var(--f-body)}
.ax text{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ax line,.ax path{stroke:var(--line);shape-rendering:crispEdges}
.hit{fill:transparent;cursor:default}
</style>

</head>

i1_h:["Start where burden is highest","优先覆盖高负担地区"], i1_p:["Absolute gains were concentrated in the high-transmission area. Where baseline prevalence is low and falling anyway, the same effort buys much less.","绝对获益集中在高传播区。在基线较低且本已下降的地区，同等投入的收益要小得多。"],
i2_h:["Make school-age children a priority group","将学龄儿童列为重点人群"], i2_p:["Children aged 5–14 carry the most infection and showed the largest effect. School-based testing could reach them between village rounds.","5–14岁儿童感染最多，效果也最大。可在村级筛查间隙通过学校开展检测。"],
i3_h:["Budget for repeated rounds","为多轮筛查预留预算"], i3_p:["Positivity in revisited hamlets fell only modestly between visits. Plan for sustained cycles in hotspots rather than one-off sweeps.","复访村组的阳性率仅小幅下降。应在热点地区规划持续循环，而非一次性筛查。"],
i4_h:["Keep test-before-treat","坚持先检测后治疗"], i4_p:["With only {fev_e_int}% of fevers positive in intervention wards, presumptive treatment wastes drugs and misses the real cause of illness.","干预乡仅{fev_e_int}%的发热为疟疾阳性，推定治疗既浪费药物，也会延误真正病因的诊治。"],
i5_h:["Ask about travel","询问外出史"], i5_p:["As local transmission falls, travellers make up a larger share of infections. Add travel history to case investigation.","本地传播下降后，外出者在感染中占比上升。应在病例调查中加入外出史。"],
i6_h:["Close the net gap for the poorest","弥补最贫困家庭的蚊帐缺口"], i6_p:["Net use among the poorest fifth still trails the richest. Pair reactive rounds with net top-ups for households found without one.","最贫困五分之一家庭的蚊帐使用率仍落后于最富裕家庭。可在反应式筛查时为无蚊帐家庭补发。"],

dq2_p:["{mda_hh}% of {mda_nhh} surveyed households in these villages report taking part in a DHA-PPQ MDA, and {mda_ind}% of residents took the drug. Those who took it had {mda_took}% prevalence against {mda_not}% for those who did not.","上述村庄{mda_nhh}户受访家庭中{mda_hh}%报告参与DHA-PPQ群体服药，{mda_ind}%的居民服药。服药者感染率为{mda_took}%，未服药者为{mda_not}%。"],
dq2_f:["Confirm timing and coverage with the field team, and report a sensitivity analysis that excludes these villages.","与现场团队核实开展时间与覆盖范围，并报告剔除这些村庄的敏感性分析。"],
dq3_h:["The survey footprint changed between rounds","两轮调查范围不一致"],
dq3_p:["{n_bonly} villages appear only at baseline and {n_eonly} only at endline, mostly in the control arm. Restricting to the {n_common} common villages moves the adjusted OR from {or_adj} to {or_com}.","{n_bonly}个村仅在基线调查，{n_eonly}个村仅在终线调查，多为对照组。仅保留{n_common}个共同村时，调整后比值比由{or_adj}变为{or_com}。"],
dq3_f:["Report the common-village estimate alongside the main one.","在主要结果旁同时报告共同村庄的估计。"],

dq4_p:["The share of households in the poorest wealth fifth fell from {q1sh_b}% at baseline to {q1sh_e}% at endline. Some of this may be real change, some sampling.","最贫困五分之一家庭占比由基线{q1sh_b}%降至终线{q1sh_e}%，其中部分可能为真实变化，部分源于抽样。"],

<tr><td>1</td><td>Empty member records</td><td>Rows with no sex, age or test data are dropped</td><td>{{b_empty}} dropped → {{b_rows}} people</td><td>0 dropped → {{e_raw}} people</td></tr>

<p>各步骤在 <code>01_harmonize.py</code> 中执行；计数由 <code>05_cleaning_log.py</code> 从原始文件重新计算。</p>

<tr><td>9</td><td>“不知道”</td><td>发热、就医与蚊帐使用中的编码98设为缺失。</td><td>发热{{b_fever_dk}}；就医{{b_seek_dk}}；蚊帐{{b_net_dk}}</td><td>就医{{e_seek_dk}}；蚊帐缺失{{e_net_miss}}</td></tr>

<tr><td>11</td><td>外出</td><td>过去一个月离村外出。基线该题仅{{b_travel_ans}}人作答，故外出分析仅用终线。</td><td>未分析</td><td>全部作答</td></tr>
<tr><td>12</td><td>住房</td><td>改良地面=木板、水磨石或水泥；改良屋顶=瓦、混凝土、铁皮或石棉；改良墙体=石、水泥或砖。“其他”（99）与“不知道”（98）计为未改良。基线窗纱编码3（无窗）设为缺失。</td><td>编码3：{{b_screen3}}行</td><td>–</td></tr>

</tbody></table>`] },

{ id: "m-wealth", open: false, wealth: true,
  t: ["Wealth index", "财富指数"],
  h: [`
<p>Each household contributes one record ({{w_hh}} households across both rounds). The 21 binary items below were standardised and combined with principal component analysis on the pooled data, so one scale applies to both rounds. The first component explains {{w_pc1}}% of variance (second: {{w_pc2}}%). Its sign is set so that owning a motorcycle raises the score. No item had missing values after recoding, so mode imputation was not triggered. Households are cut into quintiles at the pooled 20th, 40th, 60th and 80th percentiles ({{w_cuts}}). Livestock items load near zero and contribute almost nothing.</p>`,
`
<p>每户一条记录（两轮合计{{w_hh}}户）。下列21项二分类指标经标准化后，在合并数据上进行主成分分析，使两轮采用同一尺度。第一主成分解释{{w_pc1}}%的方差（第二主成分{{w_pc2}}%），方向设定为拥有摩托车者得分更高。重新编码后各指标均无缺失，未触发众数插补。按合并样本第20、40、60、80百分位（{{w_cuts}}）将家庭五等分。牲畜类指标载荷接近零，几乎无贡献。</p>`] },

{ id: "m-stats", open: false,
  t: ["Statistical analysis", "统计分析"],
  h: [`
<p><b>Prevalence.</b> RDT prevalence is the mean of the binary outcome among people tested; its 95% CI uses a household-clustered sandwich standard error (equivalent to a GEE with identity link and independence working correlation).</p>
<p><b>Difference-in-differences.</b> For person <i>i</i> in household <i>h</i> in round <i>t</i>:</p>
<div class="eq">logit Pr(y<sub>iht</sub> = 1) = β<sub>0</sub> + β<sub>1</sub>·Endline<sub>t</sub> + β<sub>2</sub>·Arm<sub>h</sub> + β<sub>3</sub>·(Endline<sub>t</sub> × Arm<sub>h</sub>) + γ′X<sub>iht</sub></div>
<p>exp(β<sub>3</sub>) is the DiD odds ratio. The same specification with an identity link (linear probability model) gives β<sub>3</sub> in percentage points. X contains age group (5–14, 15+ vs &lt;5), sex, net use the previous night and wealth quintile (Q2–Q5 vs Q1); crude models omit X. Logistic models are fitted by Newton–Raphson.</p>
<p><b>Standard errors.</b> Cluster-robust (sandwich) by household with the small-sample factor G/(G−1) × (N−1)/(N−K); 95% Wald intervals; two-sided p-values from the normal distribution. The adjusted model has {{adj}} people in {{adj_hh}} households.</p>
<p><b>Counterfactual.</b> Expected intervention prevalence at endline = intervention baseline × (control endline ÷ control baseline). The headline reduction compares the observed endline prevalence with this value.</p>
<p><b>Sensitivity and subgroups.</b> (1) Crude vs adjusted. (2) Same-village restriction: only the {{n_common}} villages sampled in both rounds. (3) Transmission area: each intervention area against all control wards. (4) Subgroups: the adjusted model refitted within age group, sex, wealth quintile and net use, dropping the covariate that defines the subgroup. (5) Risk factors: one pooled logistic model adding open eaves, window screens and improved floor, roof and walls.</p>
<p><b>Other estimates.</b> Net cascade, fever, care-seeking and travel are proportions with household-clustered CIs. Travel odds ratio: endline-only logistic model with arm, travel, age group, sex, net use and wealth. RDT–slide agreement: Cohen's κ from the 2×2 table, with expected double-positives = (RDT+ × slide+) ÷ N.</p>
<p><b>Software.</b> Python 3 with pandas and NumPy; estimators written in <code>stats.py</code> without external statistics packages. Results were checked against the published positive counts (1,103 · 967 · 621 · 163) and odds ratio (0.34).</p>`,
`
<p><b>感染率。</b>RDT感染率为受检者二分类结局的均值；95%置信区间采用按家庭聚类的三明治标准误（等价于恒等连接、独立工作相关矩阵的GEE）。</p>
<p><b>双重差分。</b>对于第<i>t</i>轮、家庭<i>h</i>中的个体<i>i</i>：</p>
<div class="eq">logit Pr(y<sub>iht</sub> = 1) = β<sub>0</sub> + β<sub>1</sub>·终线<sub>t</sub> + β<sub>2</sub>·分组<sub>h</sub> + β<sub>3</sub>·(终线<sub>t</sub> × 分组<sub>h</sub>) + γ′X<sub>iht</sub></div>
<p>exp(β<sub>3</sub>)为双重差分比值比。采用恒等连接的同一设定（线性概率模型）得到以百分点表示的β<sub>3</sub>。X包括年龄组（5–14、15+对比&lt;5）、性别、前夜蚊帐使用及财富五分位（Q2–Q5对比Q1）；未调整模型不含X。logistic模型以Newton–Raphson法拟合。</p>
<p><b>标准误。</b>按家庭聚类的稳健（三明治）标准误，小样本校正因子G/(G−1) × (N−1)/(N−K)；95% Wald区间；双侧p值基于正态分布。调整模型纳入{{adj_hh}}户{{adj}}人。</p>
<p><b>反事实。</b>干预组终线预期感染率 = 干预组基线 ×（对照组终线 ÷ 对照组基线）。主要降幅为观察到的终线感染率与该值之比。</p>
<p><b>敏感性与亚组分析。</b>（1）未调整与调整模型。（2）相同村庄：仅限两轮均抽样的{{n_common}}个村。（3）传播区域：各干预片区分别对比全部对照乡。（4）亚组：在年龄组、性别、财富五分位及蚊帐使用各亚组内重新拟合调整模型，并去除定义该亚组的协变量。（5）风险因素：在合并logistic模型中加入屋檐开放、窗纱及改良地面、屋顶、墙体。</p>
<p><b>其他估计。</b>蚊帐覆盖链、发热、就医与外出为比例，置信区间按家庭聚类。外出比值比：仅终线的logistic模型，含分组、外出、年龄组、性别、蚊帐使用与财富。RDT与镜检一致性：基于2×2表计算Cohen κ，随机预期双阳性数 =（RDT阳性 × 镜检阳性）÷ N。</p>
<p><b>软件。</b>Python 3（pandas、NumPy）；估计量在 <code>stats.py</code> 中自行实现，未使用外部统计包。结果已与已发表的阳性数（1,103 · 967 · 621 · 163）及比值比（0.34）核对。</p>`] },

{ id: "m-fac", open: false,

  h: [`
<table class="mt steps"><thead><tr><th>#</th><th>Step</th><th>Rule and result</th></tr></thead><tbody>
<tr><td>1</td><td>Layout</td><td>Two blocks on sheet 1: lower-transmission area (Ikwiriri HC, Arafa, Faraja, Mico, Mission, AMELAB) and high-transmission area (Mohoro HC, Arafa, Ndundutawa, Kiwanga, Chumbi), 42 reporting periods each, November 2015 – October 2016. Each facility has suspected tested, positive and positivity columns; positivity is recomputed from counts.</td></tr>
<tr><td>2</td><td>Period labels</td><td>Free-text labels (e.g. “14.12.15-3.1.16”) parsed into start and end dates. Fixed: {{lab_irr}}. Four periods span 2–4 weeks ({{multi}}); counts are divided by days × 7 when shown per week, positivity is unaffected.</td></tr>
<tr><td>3</td><td>Totals check</td><td>Row sums against the workbook's own total rows. Lower area: {{low_s}} tested (total row {{low_ts}}), {{low_p}} positive (total row {{low_tp}}). High area: {{hi_s}} tested (total row {{hi_ts}}), {{hi_p}} positive (total row {{hi_tp}}). The small gaps are in the workbook totals; row values are used.</td></tr>
<tr><td>4</td><td>Completeness</td><td>A period with zero suspected cases is treated as not reported: AMELAB {{z_amelab}}/42, Ndundutawa {{z_ndu}}/42, Kiwanga {{z_kiw}}/42, Chumbi {{z_chu}}/42; all other facilities 42/42.</td></tr>
<tr><td>5</td><td>Duplicate row</td><td>Mohoro HC, 7–13 Dec 2015 ({{dup}}) is identical to Ikwiriri HC's November 2015 row. Kept, flagged on the chart.</td></tr>
<tr><td>6</td><td>FSAT log</td><td>{{fs_low_rows}} hamlet-visit rows in the lower area and {{fs_hi_rows}} in the high area. Merged cells for date and village are carried down. Totals reproduce the workbook exactly: {{fs_low}} and {{fs_hi}} (screened, positive).</td></tr>
<tr><td>7</td><td>Hamlet names</td><td>Spelling variants unified before counting visits: Msikiti/Msikitini, Nyalindi/Nyarindi, Ngansinda/Ngasinda, Kwampakaliwa/Mpakilwa, Mpima road/Mpima; village prefixes “Centre/Center/Central” merged. Visit number = order of screening date within a hamlet; visits 3+ are pooled.</td></tr>
<tr><td>8</td><td>Implausible rows</td><td>{{fs_gtpop}} rows report more people screened than the hamlet population and {{fs_gthh}} rows more households screened than listed. Kept as recorded.</td></tr>
</tbody></table>`,
`

{ id: "m-geo", open: false,
  t: ["Maps and village linkage", "地图与村庄匹配"],
  h: [`
<ul>
<li><b>Name matching.</b> {{n_name}} of {{n_vil}} survey village names match a polygon in the Rufiji/Kibiti boundary file directly or through spelling aliases (Muhoro → Mohoro, Ndundu Tawa → Ndundutawa, Kingwila → Kingwira, Zimbwini → Zimwini). Muhoro Magharibi and Muhoro Mashariki share the single Mohoro polygon.</li>
<li><b>GPS placement.</b> The remaining {{n_gps}} names are placed in the polygon that contains most of their endline households: King'ongo and Shela → Mohoro, Mbebetini → Sokoni, Mangombela → Bungu A.</li>
<li><b>GPS validation.</b> All {{gps_n}} endline households were tested with a point-in-polygon check: {{gps_in}}% fall inside a village polygon, {{gps_w}}% inside the ward recorded on the form and {{gps_v}}% inside the recorded village. Household coordinates are used only for this check and are not published.</li>
<li><b>Geometry.</b> Coordinates snapped to 0.00001° so shared borders match exactly; vertices where the set of neighbouring polygons changes are fixed, and the lines between them are simplified with Douglas–Peucker at 0.0012° (about 130 m). This keeps shared borders identical, with no gaps or slivers. Village vertices fell from {{v0}} to {{v1}}.</li>
<li><b>Display.</b> Planar projection (latitude reflected), adequate at this scale. Prevalence classes: 0–5, 5–10, 10–15, 15–20, 20–30, 30–40, 40%+; net-use classes in 10-point steps from 40%. Phase I/II arms come from Table 1 of the study-area file.</li>
</ul>`,
`
<ul>
<li><b>名称匹配。</b>{{n_vil}}个调查村名中，{{n_name}}个可直接或经拼写别名（Muhoro → Mohoro、Ndundu Tawa → Ndundutawa、Kingwila → Kingwira、Zimbwini → Zimwini）匹配到鲁菲吉/基比蒂边界文件中的多边形。Muhoro Magharibi与Muhoro Mashariki共用Mohoro多边形。</li>
<li><b>GPS定位。</b>其余{{n_gps}}个村名归入包含其多数终线家庭的多边形：King'ongo与Shela → Mohoro，Mbebetini → Sokoni，Mangombela → Bungu A。</li>
<li><b>GPS核验。</b>对全部{{gps_n}}户终线家庭做点面包含检验：{{gps_in}}%位于某一村多边形内，{{gps_w}}%位于问卷记录的乡内，{{gps_v}}%位于记录的村内。家庭坐标仅用于此核验，不予公开。</li>
<li><b>几何处理。</b>坐标对齐至0.00001°以使共享边界完全重合；相邻多边形集合发生变化的顶点保持固定，其间线段以Douglas–Peucker法按0.0012°（约130米）简化，使共享边界保持一致、无缝隙。村级顶点由{{v0}}个减少至{{v1}}个。</li>

  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  yGrid(g, y, m.l, x1 + 6, d3.range(0, ymax + 1, ymax > 30 ? 10 : 5), v => v + "%", C.grid, C.ink2);
  [[x0, t("s_base")], [x1, t("s_end")]].forEach(([x, l]) => g.append("text").attr("x", x).attr("y", h - 10).attr("text-anchor", "middle").attr("font-size", 12).attr("fill", C.ink2).text(l));
  // counterfactual
  g.append("line").attr("x1", x0).attr("y1", y(d.bi.p)).attr("x2", x1).attr("y2", y(d.cf)).attr("stroke", C.int).attr("stroke-width", 2).attr("stroke-dasharray", "5 5").attr("opacity", .75);
  const lines = [["ctl", d.bc, d.ec, C.ctl, -4], ["int", d.bi, d.ei, C.int, 4]];
  lines.forEach(([k, a, b, col]) => g.append("line").attr("x1", x0).attr("y1", y(a.p)).attr("x2", x1).attr("y2", y(b.p)).attr("stroke", col).attr("stroke-width", 2.5).attr("stroke-linecap", "round"));
  if (!night) { const red = Math.round(100 * (1 - d.ei.p / d.cf));
    const bt = g.append("text").attr("x", x0 + 4).attr("y", y(Math.min(4, ymax * 0.1)) - 4).attr("fill", C.ink);
    bt.append("tspan").attr("font-size", 20).attr("font-weight", 600).text(MINUS + red + "%");
    bt.append("tspan").attr("dx", 8).attr("font-size", 12).attr("fill", C.ink2).text(t("below_exp_long"));
 }
  // whiskers + dots
  const pts = [];
  lines.forEach(([k, a, b, col, off]) => { [[x0, a, "s_base"], [x1, b, "s_end"]].forEach(([x, v, rk]) => pts.push({ k, x: x + off, v, col, rk })); });
  pts.forEach(p => { g.append("line").attr("x1", p.x).attr("x2", p.x).attr("y1", y(p.v.lo)).attr("y2", y(p.v.hi)).attr("stroke", p.col).attr("stroke-width", 1.5).attr("opacity", .8); });
  g.append("circle").attr("cx", x1).attr("cy", y(d.cf)).attr("r", 4.5).attr("fill", C.ring).attr("stroke", C.int).attr("stroke-width", 2);
  const dots = g.selectAll(".dt").data(pts).join("circle").attr("cx", p => p.x).attr("cy", p => y(p.v.p)).attr("r", 5.5).attr("fill", p => p.col).attr("stroke", C.ring).attr("stroke-width", 2);
  // labels
  const lab = spread([
    { y: y(d.ec.p), ly: y(d.ec.p), a: t("s_ctl"), b: pct(d.ec.p), col: C.ctl },
    { y: y(d.cf), ly: y(d.cf), a: t("s_cf_short"), b: pct(d.cf), col: C.int, dash: true },
    { y: y(d.ei.p), ly: y(d.ei.p), a: t("s_int"), b: pct(d.ei.p), col: C.int },
  ], 30, m.t + 8, h - m.b - 4);
  lab.forEach(L => {
    const lx = x1 + 26;
    g.append("path").attr("d", `M${x1 + 9},${L.y}C${x1 + 18},${L.y} ${x1 + 14},${L.ly} ${lx - 4},${L.ly}`).attr("fill", "none").attr("stroke", C.grid).attr("stroke-width", 1);
    const tx = g.append("text").attr("x", lx).attr("y", L.ly).attr("font-size", 12).attr("fill", C.ink2);
    tx.append("tspan").attr("x", lx).attr("dy", "-0.35em").text(L.a);
    tx.append("tspan").attr("x", lx).attr("dy", "1.2em").attr("font-weight", 600).attr("fill", C.ink).attr("font-size", 13.5).text(L.b);
  });
  g.append("text").attr("x", 0).attr("y", 10).attr("font-size", 11).attr("fill", C.ink2).text(o.ylab || "");
  // hover
  const hits = g.selectAll(".hit").data(pts).join("circle").attr("class", "hit").attr("cx", p => p.x).attr("cy", p => y(p.v.p)).attr("r", 14).attr("tabindex", 0);
  bindTip(hits, p => [t(p.k === "int" ? "s_int" : "s_ctl") + " · " + t(p.rk), [{ c: p.col, v: pct(p.v.p), l: `95% CI ${f1(p.v.lo)}–${f1(p.v.hi)}` }], `n = ${thou(p.v.n)} · ${thou(p.v.k)} +`]);
}

/* ---------- forest plot ---------- */
function forest(el, w, rows, o) {
  const narrow = w < 420, rowH = 30, hdrH = 28, axisH = 40;
  const labelW = Math.min(Math.max(w * 0.36, 120), 240), textW = narrow ? 92 : 124, extraW = o.extra ? (narrow ? 46 : 64) : 0;
  const x0 = labelW + 8, x1 = w - textW - extraW - 8;
  let yy = o.extra ? 22 : 6; rows.forEach(r => { r._y = yy + (r.h ? hdrH : rowH) / 2 + (r.h ? 2 : 0); yy += r.h ? hdrH : rowH; });
  const h = yy + axisH;
  const x = o.log ? d3.scaleLog(o.domain, [x0, x1]).clamp(true) : d3.scaleLinear(o.domain, [x0, x1]).clamp(true);
  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  const ticks = o.ticks || x.ticks(6);
  ticks.forEach(v => g.append("line").attr("x1", Math.round(x(v)) + .5).attr("x2", Math.round(x(v)) + .5).attr("y1", 4).attr("y2", yy).attr("stroke", K.line));
  g.append("line").attr("x1", Math.round(x(o.ref)) + .5).attr("x2", Math.round(x(o.ref)) + .5).attr("y1", 2).attr("y2", yy + 2).attr("stroke", K["line-2"]).attr("stroke-width", 1.5);
  ticks.forEach(v => g.append("text").attr("x", x(v)).attr("y", yy + 16).attr("text-anchor", "middle").attr("font-size", 11.5).attr("fill", K.muted).style("font-variant-numeric", "tabular-nums").text(o.tickFmt ? o.tickFmt(v) : v));
  g.append("text").attr("x", (x0 + x1) / 2).attr("y", yy + 34).attr("text-anchor", "middle").attr("font-size", 11.5).attr("fill", K["ink-2"]).text(o.xlab);
  if (o.extra) g.append("text").attr("x", w - 4).attr("y", 12).attr("text-anchor", "end").attr("font-size", 11).attr("fill", K.muted).text(o.extra);
  rows.forEach(r => {
    if (r.h) { g.append("text").attr("x", 0).attr("y", r._y).attr("dy", "0.32em").attr("font-size", 11).attr("font-weight", 600).attr("fill", K.muted).style("letter-spacing", ".06em").style("text-transform", "uppercase").style("font-family", "var(--f-mono)").text(r.label);
      g.append("line").attr("x1", 0).attr("x2", w).attr("y1", r._y - hdrH / 2 + 1.5).attr("y2", r._y - hdrH / 2 + 1.5).attr("stroke", K.line); return; }
    const col = r.color || K.int;
    const lt = g.append("text").attr("x", 0).attr("y", r._y).attr("dy", "0.32em").attr("font-size", narrow ? 12 : 13).attr("fill", r.muted ? K.muted : K.ink).text(r.label);
    if (r.label.length * (narrow ? 6.6 : 7.2) > labelW) lt.attr("textLength", labelW - 4).attr("lengthAdjust", "spacingAndGlyphs");
    g.append("line").attr("x1", x(r.lo)).attr("x2", x(r.hi)).attr("y1", r._y).attr("y2", r._y).attr("stroke", col).attr("stroke-width", 2).attr("stroke-linecap", "round").attr("opacity", r.muted ? .6 : 1);
    g.append(r.diamond ? "path" : "circle").call(s => r.diamond ? s.attr("d", `M${x(r.est)},${r._y - 6}l6,6l-6,6l-6,-6z`) : s.attr("cx", x(r.est)).attr("cy", r._y).attr("r", 5.5))
      .attr("fill", r.hollow ? K.surface : col).attr("stroke", r.hollow ? col : K.surface).attr("stroke-width", 2);
    g.append("text").attr("x", w - extraW - 4).attr("y", r._y).attr("dy", "0.32em").attr("text-anchor", "end").attr("font-size", narrow ? 11.5 : 12.5).attr("fill", r.sig === false ? K.muted : K.ink).style("font-variant-numeric", "tabular-nums")
      .text(o.fmt(r.est) + (narrow ? "" : ` (${o.ciFmt(r.lo, r.hi)})`));
    if (o.extra && r.extra != null) g.append("text").attr("x", w - 4).attr("y", r._y).attr("dy", "0.32em").attr("text-anchor", "end").attr("font-size", 12).attr("fill", K["ink-2"]).style("font-variant-numeric", "tabular-nums").text(r.extra);
  });
  const hits = g.selectAll(".hit").data(rows.filter(r => !r.h)).join("rect").attr("class", "hit").attr("x", 0).attr("width", w).attr("y", r => r._y - rowH / 2).attr("height", rowH).attr("tabindex", 0);
  bindTip(hits, r => [r.label, [{ c: r.color || K.int, v: o.fmt(r.est), l: `95% CI ${o.ciFmt(r.lo, r.hi)}` }], r.tipNote]);
}

/* ---------- small-multiple lines ---------- */
function smLines(el, w, panels, o) {
  const cols = w >= 500 ? panels.length : 1, gapX = 28, pw = (w - gapX * (cols - 1)) / cols, ph = o.h || 230;
  const rowsN = Math.ceil(panels.length / cols), h = rowsN * (ph + 30);
  const svg = svgEl(el, w, h, o.aria);
  panels.forEach((pn, i) => {
    const ox = (i % cols) * (pw + gapX), oy = Math.floor(i / cols) * (ph + 30);
    const g = svg.append("g").attr("transform", `translate(${ox},${oy})`);
    const m = { l: 36, r: 12, t: 26, b: 34 };
    const xs = d3.scalePoint(o.xLabels.map((_, j) => j), [m.l + 10, pw - m.r - 10]);
    const y = d3.scaleLinear([0, o.ymax], [ph - m.b, m.t]);
    g.append("text").attr("x", 0).attr("y", 12).attr("font-size", 13).attr("font-weight", 600).attr("fill", K.ink).text(pn.title);
    yGrid(g, y, m.l, pw - m.r, d3.range(0, o.ymax + 1, o.ystep), v => v + "%", K.line, K.muted);
    o.xLabels.forEach((l, j) => { const show = pw > 330 || j % 2 === 0 || j === o.xLabels.length - 1;
      if (show) g.append("text").attr("x", xs(j)).attr("y", ph - m.b + 17).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", K.muted).text(l); });
    if (o.xlab) g.append("text").attr("x", (m.l + pw - m.r) / 2).attr("y", ph - 2).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", K["ink-2"]).text(o.xlab);
    pn.series.forEach(s => {
      const pts = s.vals.map((v, j) => v ? [xs(j), y(v.p)] : null).filter(Boolean);
      g.append("path").attr("d", d3.line()(pts)).attr("fill", "none").attr("stroke", s.color).attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("stroke-linecap", "round");
      g.selectAll(null).data(s.vals.map((v, j) => ({ v, j })).filter(d => d.v)).join("circle").attr("cx", d => xs(d.j)).attr("cy", d => y(d.v.p)).attr("r", 4).attr("fill", s.hollow ? K.surface : s.color).attr("stroke", s.hollow ? s.color : K.surface).attr("stroke-width", 2);
    });
    const cross = g.append("line").attr("y1", m.t).attr("y2", ph - m.b).attr("stroke", K["line-2"]).attr("opacity", 0);
    const ov = g.append("rect").attr("x", m.l).attr("y", m.t).attr("width", pw - m.l - m.r).attr("height", ph - m.t - m.b).attr("fill", "transparent").attr("tabindex", 0).attr("aria-label", pn.title);
    const at = (j, cx, cy) => { cross.attr("x1", xs(j)).attr("x2", xs(j)).attr("opacity", 1);
      tipShow(cx, cy, pn.title + " · " + o.xLabels[j], pn.series.map(s => ({ c: s.color, v: s.vals[j] ? pct(s.vals[j].p) : "–", l: s.label + (s.vals[j] ? ` (${f1(s.vals[j].lo)}–${f1(s.vals[j].hi)})` : "") })), o.tipNote ? o.tipNote(j) : null); };
    ov.on("pointermove", ev => { const [mx] = d3.pointer(ev); let best = 0, bd = 1e9; o.xLabels.forEach((_, j) => { const dd = Math.abs(xs(j) - mx); if (dd < bd) { bd = dd; best = j; } }); at(best, ev.clientX, ev.clientY); })
      .on("pointerleave", () => { cross.attr("opacity", 0); tipHide(); })
      .on("focus", function () { const b = this.getBoundingClientRect(); at(0, b.left + 40, b.top + 20); }).on("blur", () => { cross.attr("opacity", 0); tipHide(); });
  });
}

/* ---------- dumbbell ---------- */
function dumbbell(el, w, rows, o) {
  const narrow = w < 520, labelW = Math.min(Math.max(w * 0.3, 110), 200), rowH = 50, axisH = 38;
  const x0 = labelW + 12, x1 = w - 30;
  const x = d3.scaleLinear([0, o.xmax || 100], [x0, x1]);
  const h = rows.length * rowH + axisH + 6;
  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  const ticks = d3.range(0, (o.xmax || 100) + 1, o.xstep || 20);
  ticks.forEach(v => { g.append("line").attr("x1", Math.round(x(v)) + .5).attr("x2", Math.round(x(v)) + .5).attr("y1", 0).attr("y2", rows.length * rowH).attr("stroke", K.line);
    g.append("text").attr("x", x(v)).attr("y", rows.length * rowH + 16).attr("text-anchor", "middle").attr("font-size", 11.5).attr("fill", K.muted).text(v + "%"); });
  g.append("text").attr("x", (x0 + x1) / 2).attr("y", rows.length * rowH + 33).attr("text-anchor", "middle").attr("font-size", 11.5).attr("fill", K["ink-2"]).text(o.xlab || "");
  const all = [];
  rows.forEach((r, i) => {
    const cy = i * rowH + rowH / 2;
    const lt = g.append("text").attr("x", 0).attr("y", cy).attr("dy", "0.32em").attr("font-size", narrow ? 12 : 13).attr("fill", K.ink).text(r.label);
    if (r.label.length * 7 > labelW) lt.attr("textLength", labelW - 2).attr("lengthAdjust", "spacingAndGlyphs");
    r.pairs.forEach((p, j) => {
      const py = cy + (r.pairs.length > 1 ? (j === 0 ? -8 : 8) : 0);
      g.append("line").attr("x1", x(p.a.p)).attr("x2", x(p.b.p)).attr("y1", py).attr("y2", py).attr("stroke", p.color).attr("stroke-width", 2).attr("opacity", .5);
      g.append("circle").attr("cx", x(p.a.p)).attr("cy", py).attr("r", 4.5).attr("fill", K.surface).attr("stroke", p.color).attr("stroke-width", 2);
      g.append("circle").attr("cx", x(p.b.p)).attr("cy", py).attr("r", 5).attr("fill", p.color).attr("stroke", K.surface).attr("stroke-width", 2);
      const right = p.b.p >= p.a.p, tx = x(p.b.p) + (right ? 10 : -10);
      g.append("text").attr("x", tx).attr("y", py).attr("dy", "0.32em").attr("text-anchor", right ? "start" : "end").attr("font-size", 11.5).attr("font-weight", 600).attr("fill", K.ink).style("font-variant-numeric", "tabular-nums").text(pct(p.b.p, 0));
      all.push({ r, p, py });
    });
  });
  const hits = g.selectAll(".hit").data(all).join("rect").attr("class", "hit").attr("x", x0 - 8).attr("width", x1 - x0 + 16).attr("y", d => d.py - 8).attr("height", 16).attr("tabindex", 0);
  bindTip(hits, d => [d.r.label + " · " + d.p.name, [{ c: d.p.color, v: pct(d.p.a.p), l: t("s_base_s") + ` (n=${thou(d.p.a.n)})` }, { c: d.p.color, v: pct(d.p.b.p), l: t("s_end_s") + ` (n=${thou(d.p.b.n)})` }], `${t("pn_change")}: ${sg(d.p.b.p - d.p.a.p)} ${t("pts")}`]);
}

/* ---------- stacked bars ---------- */
function stacked(el, w, rows, cats, o) {
  const labelW = Math.min(Math.max(w * 0.26, 110), 170), barH = 22, rowH = 40, x0 = labelW + 10, x1 = w - 4;
  const x = d3.scaleLinear([0, 100], [x0, x1]), h = rows.length * rowH + 26;
  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  [0, 25, 50, 75, 100].forEach(v => g.append("text").attr("x", x(v)).attr("y", h - 6).attr("text-anchor", v === 0 ? "start" : v === 100 ? "end" : "middle").attr("font-size", 11).attr("fill", K.muted).text(v + "%"));
  const segs = [];
  rows.forEach((r, i) => {
    const cy = i * rowH + 8;
    g.append("text").attr("x", 0).attr("y", cy + barH / 2).attr("dy", "0.32em").attr("font-size", 12.5).attr("fill", K.ink).text(r.label);
    let acc = 0; const parts = cats.filter(c => (r.vals[c.k] || 0) > 0);
    parts.forEach((c, j) => { const v = r.vals[c.k]; const xa = x(acc), xb = x(acc + v) - (j < parts.length - 1 ? 2 : 0); acc += v;
      const rr = g.append("rect").attr("x", xa).attr("y", cy).attr("width", Math.max(0, xb - xa)).attr("height", barH).attr("fill", c.color).attr("rx", j === parts.length - 1 ? 3 : 0);
      segs.push({ r, c, v, xa, xb, cy });
      if (xb - xa > 34) g.append("text").attr("x", (xa + xb) / 2).attr("y", cy + barH / 2).attr("dy", "0.34em").attr("text-anchor", "middle").attr("font-size", 11).attr("font-weight", 600).attr("fill", c.dark ? "#0b0b0b" : "#ffffff").style("pointer-events", "none").text(Math.round(v) + "%");
    });
  });
  const hits = g.selectAll(".hit").data(segs).join("rect").attr("class", "hit").attr("x", d => d.xa).attr("y", d => d.cy - 4).attr("width", d => Math.max(4, d.xb - d.xa)).attr("height", barH + 8).attr("tabindex", 0);
  bindTip(hits, d => [d.r.label, [{ c: d.c.color, v: pct(d.v), l: t(d.c.l) }], `n = ${d.r.n}`]);
}

/* ---------- time series ---------- */
function tsChart(el, w, o) {
  const narrow = w < 560, h = narrow ? 280 : 320, m = { l: 40, r: 12, t: 22, b: 30 };
  const x = d3.scaleTime([new Date(2015, 10, 1), new Date(2016, 9, 22)], [m.l, w - m.r]);
  const y = d3.scaleLinear([0, 80], [h - m.b, m.t]);
  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  const s0 = x(new Date(2016, 4, 1)), s1 = x(new Date(2016, 7, 31));
  g.append("rect").attr("x", s0).attr("y", m.t).attr("width", s1 - s0).attr("height", h - m.t - m.b).attr("fill", K["surface-2"]);
  g.append("text").attr("x", s0 + 6).attr("y", m.t + 13).attr("font-size", 11).attr("fill", K.muted).text(t("season"));
  yGrid(g, y, m.l, w - m.r, [0, 20, 40, 60, 80], v => v + "%", K.line, K.muted);
  const months = d3.timeMonth.range(new Date(2015, 10, 1), new Date(2016, 9, 2));
  months.forEach((d, i) => { if (narrow && i % 2) return; g.append("text").attr("x", x(d)).attr("y", h - 10).attr("text-anchor", "start").attr("font-size", 11).attr("fill", K.muted)
    .text(LANG === "zh" ? `${d.getMonth() + 1}月` : d.toLocaleString("en-US", { month: "short" }) + (d.getMonth() === 0 || i === 0 ? " " + String(d.getFullYear()).slice(2) : "")); });
  const prep = (rows, col, area) => rows.map(r => { const s = new Date(r.start), e = new Date(r.end); return { d: new Date((+s + +e) / 2), r, col, area }; });
  const SH = prep(H.hf_high, K["hi-area"], "hi"), SL = prep(H.hf_low, K["lo-area"], "lo");
  [SL, SH].forEach(S => { g.append("path").attr("d", d3.line().x(p => x(p.d)).y(p => y(p.r.tpr)).curve(d3.curveMonotoneX)(S)).attr("fill", "none").attr("stroke", S[0].col).attr("stroke-width", 2).attr("stroke-linejoin", "round"); });
  const flag = SH.find(p => p.r.label.indexOf("7-13.12") === 0);
  if (flag) g.append("circle").attr("cx", x(flag.d)).attr("cy", y(flag.r.tpr)).attr("r", 7).attr("fill", "none").attr("stroke", K.ink).attr("stroke-width", 1.2).attr("stroke-dasharray", "2 2");
  const FS = H.fsat_monthly.map(r => { const [yy, mm] = r.month.split("-").map(Number); return { d: new Date(yy, mm - 1, 15), r, col: r.area === "high" ? K["hi-area"] : K["lo-area"], area: r.area }; });
  g.selectAll(null).data(FS).join("circle").attr("cx", p => x(p.d)).attr("cy", p => y(p.r.tpr)).attr("r", 5).attr("fill", p => p.col).attr("stroke", K.surface).attr("stroke-width", 2);
  g.selectAll(null).data(FS).join("rect").attr("x", p => x(p.d) - 6).attr("y", p => y(p.r.tpr) - 6).attr("width", 12).attr("height", 12).attr("transform", p => `rotate(45 ${x(p.d)} ${y(p.r.tpr)})`).attr("fill", "none").attr("stroke", "none");
  const cross = g.append("line").attr("y1", m.t).attr("y2", h - m.b).attr("stroke", K["line-2"]).attr("opacity", 0);
  const near = (S, dt) => S.reduce((a, b) => Math.abs(b.d - dt) < Math.abs(a.d - dt) ? b : a);
  const ov = g.append("rect").attr("x", m.l).attr("y", m.t).attr("width", w - m.l - m.r).attr("height", h - m.t - m.b).attr("fill", "transparent").attr("tabindex", 0).attr("aria-label", t("k_ts_h"));
  const show = (dt, cx, cy) => {
    const a = near(SH, dt), b = near(SL, dt); cross.attr("x1", x(a.d)).attr("x2", x(a.d)).attr("opacity", 1);
    const rows = [{ c: a.col, v: pct(a.r.tpr), l: t("a_hi_s") + ` · ${thou(a.r.pos)}/${thou(a.r.susp)}` }, { c: b.col, v: pct(b.r.tpr), l: t("a_lo_s") + ` · ${thou(b.r.pos)}/${thou(b.r.susp)}` }];
    const mo = `${a.d.getFullYear()}-${String(a.d.getMonth() + 1).padStart(2, "0")}`;
    FS.filter(f => f.r.month === mo).forEach(f => rows.push({ c: f.col, v: pct(f.r.tpr), l: t("lk_fsat") + " · " + (f.area === "high" ? t("a_hi_s") : t("a_lo_s")), dash: true }));
    tipShow(cx, cy, a.r.label, rows, a === flag ? t("flag_dup") : null);
  };
  ov.on("pointermove", ev => { const [mx] = d3.pointer(ev); show(x.invert(mx), ev.clientX, ev.clientY); }).on("pointerleave", () => { cross.attr("opacity", 0); tipHide(); })
    .on("focus", function () { const b = this.getBoundingClientRect(); show(new Date(2016, 5, 10), b.left + b.width * .6, b.top + 30); }).on("blur", () => { cross.attr("opacity", 0); tipHide(); });
}

/* ---------- horizontal bars ---------- */
function hbars(el, w, rows, o) {
  const labelW = Math.min(Math.max(w * 0.4, 130), 230), rowH = 26, hdrH = 28, x0 = labelW + 8, x1 = w - 46;
  let yy = 0; rows.forEach(r => { r._y = yy + (r.h ? hdrH : rowH) / 2; yy += r.h ? hdrH : rowH; });
  const h = yy + 26, x = d3.scaleLinear([0, o.xmax], [x0, x1]);
  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  [0, 25, 50, 75].forEach(v => { g.append("line").attr("x1", Math.round(x(v)) + .5).attr("x2", Math.round(x(v)) + .5).attr("y1", 0).attr("y2", yy).attr("stroke", K.line);
    g.append("text").attr("x", x(v)).attr("y", yy + 16).attr("text-anchor", "middle").attr("font-size", 11).attr("fill", K.muted).text(v + "%"); });
  rows.forEach(r => {
    if (r.h) { g.append("text").attr("x", 0).attr("y", r._y + 3).attr("dy", "0.32em").attr("font-size", 11).attr("font-weight", 600).attr("fill", K.muted).style("letter-spacing", ".05em").style("font-family", "var(--f-mono)").style("text-transform", "uppercase").text(r.label); return; }
    const lt = g.append("text").attr("x", 0).attr("y", r._y).attr("dy", "0.32em").attr("font-size", 12.5).attr("fill", K.ink).text(r.label);
    if (r.label.length * 6.8 > labelW) lt.attr("textLength", labelW - 2).attr("lengthAdjust", "spacingAndGlyphs");
    const bw = Math.max(1, x(r.v) - x0);
    g.append("path").attr("d", `M${x0},${r._y - 7}h${bw - 4}a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h${-(bw - 4)}z`).attr("fill", r.color);
    g.append("text").attr("x", x0 + bw + 6).attr("y", r._y).attr("dy", "0.32em").attr("font-size", 12).attr("font-weight", 600).attr("fill", K.ink).style("font-variant-numeric", "tabular-nums").text(pct(r.v));
  });
  const hits = g.selectAll(".hit").data(rows.filter(r => !r.h)).join("rect").attr("class", "hit").attr("x", 0).attr("width", w).attr("y", r => r._y - rowH / 2).attr("height", rowH).attr("tabindex", 0);
  bindTip(hits, r => [r.label, [{ c: r.color, v: pct(r.v), l: r.tipL }], r.tipN]);
}

/* ---------- grouped columns ---------- */
function columns(el, w, groups, series, o) {
  const h = 260, m = { l: 40, r: 8, t: 14, b: 44 };
  const x = d3.scaleBand(groups.map((_, i) => i), [m.l, w - m.r]).padding(0.38);
  const y = d3.scaleLinear([0, o.ymax], [h - m.b, m.t]);
  const svg = svgEl(el, w, h, o.aria), g = svg.append("g");
  yGrid(g, y, m.l, w - m.r, d3.range(0, o.ymax + 1, 10), v => v + "%", K.line, K.muted);
  const bw = Math.min(24, (x.bandwidth() - 4) / series.length);
  const marks = [];
  groups.forEach((gl, i) => {
    const cx = x(i) + x.bandwidth() / 2, tot = bw * series.length + 4 * (series.length - 1);
    series.forEach((s, j) => { const v = s.vals[i]; const bx = cx - tot / 2 + j * (bw + 4), top = y(v.tpr), base = y(0);
      g.append("path").attr("d", `M${bx},${base}V${top + 4}a4,4 0 0 1 4,-4h${bw - 8}a4,4 0 0 1 4,4V${base}z`).attr("fill", s.color);
      g.append("text").attr("x", bx + bw / 2).attr("y", top - 6).attr("text-anchor", "middle").attr("font-size", 11.5).attr("font-weight", 600).attr("fill", K.ink).text(f1(v.tpr));
      marks.push({ s, v, gl, bx, top, base }); });
    g.append("text").attr("x", cx).attr("y", h - m.b + 18).attr("text-anchor", "middle").attr("font-size", 12).attr("fill", K["ink-2"]).text(gl);
  });
  g.append("text").attr("x", (m.l + w - m.r) / 2).attr("y", h - 6).attr("text-anchor", "middle").attr("font-size", 11.5).attr("fill", K["ink-2"]).text(o.xlab);
  const hits = g.selectAll(".hit").data(marks).join("rect").attr("class", "hit").attr("x", d => d.bx - 2).attr("width", bw + 4).attr("y", d => d.top - 18).attr("height", d => d.base - d.top + 18).attr("tabindex", 0);
  bindTip(hits, d => [d.s.name + " · " + d.gl, [{ c: d.s.color, v: pct(d.v.tpr), l: `${thou(d.v.pos)} / ${thou(d.v.scr)}` }], `${d.v.k} ${LANG === "zh" ? "次村组筛查" : "hamlet visits"}`]);
}

function flowDiagram() {

  const split = (k0, k1, src) => t("fl_split").replace("{x_c}", thou(src[k0])).replace("{x_i}", thou(src[k1]));

    c.appendChild(box(thou(raw), t("fl_raw")));
